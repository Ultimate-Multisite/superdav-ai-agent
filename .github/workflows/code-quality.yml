name: Code Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The required checks below must always report. A workflow-level `paths-ignore`
  # leaves them "expected" forever on docs-only PRs, so the workflow always starts
  # and docs-only PRs skip the jobs instead (a skipped job satisfies a required
  # check). The jobs run unless this job positively reports `code=false`, so a
  # classifier failure runs the full checks rather than silently skipping them.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          code="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            | bash .github/scripts/classify-changes.sh)"
          echo "Code changes: ${code}"
          echo "code=${code}" >> "${GITHUB_OUTPUT}"

  # ESLint + Stylelint merged into a single job — saves a full pnpm install.
  lint:
    name: Lint (ESLint + Stylelint)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint:js

      - name: Run Stylelint
        run: pnpm run lint:css

  # Build + bundle size merged — avoids a second install + build.
  build:
    name: Build & Bundle Size
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify committed runtime assets match source
        run: |
          git diff --exit-code -- build/
          test -z "$(git ls-files --others --exclude-standard build/)"

      - name: Check for build artifacts
        run: |
          if [ ! -d "build" ] || [ -z "$(ls -A build/*.js 2>/dev/null)" ]; then
            echo "Build failed - no JS files in build directory"
            exit 1
          fi
          echo "Build successful - artifacts found:"
          ls -la build/

      - name: Check bundle size budgets
        run: pnpm run check:bundle
